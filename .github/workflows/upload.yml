name: DeviantArt Auto Upload

on:
  schedule:
    # Wave6-C 頻度UP (規約配慮で間隔分散、ameblo UTC 3/9/13 とは衝突なし)
    - cron: '30 7 * * *'  # JST 16:30
    - cron: '30 19 * * *'  # JST 04:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests gdown pytrends

      - name: Download uploaded log
        continue-on-error: true
        run: |
          gh run download --name uploaded-log --dir . 2>/dev/null || echo "No previous log found"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run upload (attempt 1)
        id: attempt1
        continue-on-error: true
        env:
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_ACCESS_TOKEN: ${{ secrets.DA_ACCESS_TOKEN }}
          DA_REFRESH_TOKEN: ${{ secrets.DA_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python upload.py

      - name: Save tokens and log (attempt 1)
        if: always() && steps.attempt1.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-log
          path: uploaded.json
          overwrite: true

      - name: Update secrets with refreshed tokens (attempt 1)
        if: always() && steps.attempt1.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set, skipping secret update"
            exit 0
          fi
          if [ ! -f tokens.json ]; then
            echo "No tokens.json found"
            exit 0
          fi
          NEW_AT=$(python3 -c "import json; d=json.load(open('tokens.json')); print(d.get('access_token',''))" 2>/dev/null || echo "")
          NEW_RT=$(python3 -c "import json; d=json.load(open('tokens.json')); print(d.get('refresh_token',''))" 2>/dev/null || echo "")
          if [ -n "$NEW_AT" ]; then
            echo "$NEW_AT" | gh secret set DA_ACCESS_TOKEN
            echo "DA_ACCESS_TOKEN updated"
          fi
          if [ -n "$NEW_RT" ]; then
            echo "$NEW_RT" | gh secret set DA_REFRESH_TOKEN
            echo "DA_REFRESH_TOKEN updated"
          fi

      - name: Wait before retry 2
        if: steps.attempt1.outcome == 'failure'
        run: echo "Attempt 1 failed. Waiting 60s..." && sleep 60

      - name: Run upload (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        env:
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_ACCESS_TOKEN: ${{ secrets.DA_ACCESS_TOKEN }}
          DA_REFRESH_TOKEN: ${{ secrets.DA_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python upload.py

      - name: Save tokens and log (attempt 2)
        if: always() && steps.attempt2.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-log
          path: uploaded.json
          overwrite: true

      - name: Update secrets with refreshed tokens (attempt 2)
        if: always() && steps.attempt2.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set, skipping secret update"
            exit 0
          fi
          if [ ! -f tokens.json ]; then
            echo "No tokens.json found"
            exit 0
          fi
          NEW_AT=$(python3 -c "import json; d=json.load(open('tokens.json')); print(d.get('access_token',''))" 2>/dev/null || echo "")
          NEW_RT=$(python3 -c "import json; d=json.load(open('tokens.json')); print(d.get('refresh_token',''))" 2>/dev/null || echo "")
          if [ -n "$NEW_AT" ]; then
            echo "$NEW_AT" | gh secret set DA_ACCESS_TOKEN
            echo "DA_ACCESS_TOKEN updated"
          fi
          if [ -n "$NEW_RT" ]; then
            echo "$NEW_RT" | gh secret set DA_REFRESH_TOKEN
            echo "DA_REFRESH_TOKEN updated"
          fi

      - name: Wait before retry 3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: echo "Attempt 2 failed. Waiting 120s..." && sleep 120

      - name: Run upload (attempt 3)
        id: attempt3
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        env:
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_ACCESS_TOKEN: ${{ secrets.DA_ACCESS_TOKEN }}
          DA_REFRESH_TOKEN: ${{ secrets.DA_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python upload.py

      - name: Save tokens and log (attempt 3)
        if: always() && steps.attempt3.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-log
          path: uploaded.json
          overwrite: true

      - name: Update secrets with refreshed tokens (attempt 3)
        if: always() && steps.attempt3.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set, skipping secret update"
            exit 0
          fi
          if [ ! -f tokens.json ]; then
            echo "No tokens.json found"
            exit 0
          fi
          NEW_AT=$(python3 -c "import json; d=json.load(open('tokens.json')); print(d.get('access_token',''))" 2>/dev/null || echo "")
          NEW_RT=$(python3 -c "import json; d=json.load(open('tokens.json')); print(d.get('refresh_token',''))" 2>/dev/null || echo "")
          if [ -n "$NEW_AT" ]; then
            echo "$NEW_AT" | gh secret set DA_ACCESS_TOKEN
            echo "DA_ACCESS_TOKEN updated"
          fi
          if [ -n "$NEW_RT" ]; then
            echo "$NEW_RT" | gh secret set DA_REFRESH_TOKEN
            echo "DA_REFRESH_TOKEN updated"
          fi

      - name: Collect engagement and commit variant logs
        if: always()
        continue-on-error: true
        env:
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_ACCESS_TOKEN: ${{ secrets.DA_ACCESS_TOKEN }}
          DA_REFRESH_TOKEN: ${{ secrets.DA_REFRESH_TOKEN }}
        run: |
          python collect_engagement.py || true
          rm -f tokens.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log.json 2>/dev/null || true
          git add engagement.json 2>/dev/null || true
          git add uploaded.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "auto: variant log + engagement [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      # 通知方針: LINE Secretsは存在せず一度も通知されていなかったため撤去（2026-07-14）。
      # 代わりに「要対応の状態＝ジョブ失敗」とし、GitHub標準の失敗メール
      # （MuscleLove-777 の通知先Gmail）を使う。追加のSecret・外部API不要。
      # 注意: exit 0 = 投稿成功とは限らない（在庫切れ/取得失敗でも0を返す）。
      # run_status.txt で判定する（2026-06-21以降3週間、無投稿なのに緑✅だった教訓）
      - name: Fail run if attention needed
        if: always()
        run: |
          STATUS="unknown"; REMAINING=""
          if [ -f run_status.txt ]; then
            STATUS=$(sed -n 's/^status=//p' run_status.txt)
            REMAINING=$(sed -n 's/^remaining=//p' run_status.txt)
          fi
          echo "run status: ${STATUS} (remaining=${REMAINING})"
          case "$STATUS" in
            posted)
              if [ -n "$REMAINING" ] && [ "$REMAINING" -le 5 ] 2>/dev/null; then
                echo "::warning::投稿成功。ただし在庫残り${REMAINING}件 — Driveフォルダへ補充が必要"
              fi
              ;;
            no_content)
              echo "::error::在庫切れで投稿なし（全ファイル投稿済み）。Driveフォルダへ新規画像の補充が必要"
              exit 1
              ;;
            no_media)
              echo "::error::Driveからファイルを取得できず（フォルダ空 or ダウンロード失敗）"
              exit 1
              ;;
            *)
              echo "::error::アップロード失敗（詳細は上のattemptステップのログを参照）"
              exit 1
              ;;
          esac